<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pesquisa</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="pesquisa.css">
</head>
<body>
  <header class="page-header">
    <a href="../../index.html"><img src="../../assets/imgs/voltar.png" alt="home"></a>
    <div>
      <h1>Atendimento ao Cliente</h1>
      <p>Busque, consulte dividas, registre pagamentos e veja historico do cliente.</p>
    </div>
  </header>

  <main class="workspace">
    <aside class="search-panel">
      <h2>Buscar cliente</h2>
      <div class="search-row">
        <input type="text" id="search" placeholder="Nome do cliente" autocomplete="off">
        <button id="pesquisar" type="button">Buscar</button>
      </div>
      <div id="results" class="suggestions"></div>
      <button id="verClientes" type="button" class="secondary">Mostrar clientes</button>
      <div id="clientes-lista" class="client-list"></div>
    </aside>

    <section class="client-panel">
      <div id="empty-state" class="empty-state">
        <strong>Nenhum cliente selecionado</strong>
        <span>Busque pelo nome ou selecione um cliente na lista.</span>
      </div>
      <div id="results-dados"></div>
    </section>

    <aside class="actions-panel">
      <section class="payment-card">
        <h2>Pagamento</h2>
        <p id="paymentHint">Selecione um cliente com divida para registrar pagamento.</p>
        <input type="number" id="paymentValue" placeholder="Valor do pagamento" step="0.01" min="0" disabled>
        <button id="paymentButton" type="button" disabled>Registrar pagamento</button>
      </section>

      <section class="history-card">
        <div class="history-header">
          <h2>Historico</h2>
          <button id="historico" type="button" class="secondary" disabled>Atualizar</button>
        </div>
        <div id="historico-div" class="history-list"></div>
      </section>
    </aside>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-button">x</span>
      <div id="modal-text"></div>
    </div>
  </div>

  <script src="pesquisa.js"></script>
</body>
</html>
