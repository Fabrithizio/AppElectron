<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Cliente</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="clinete_style.css">
</head>
<body>
  <header class="page-header">
    <a href="../../index.html"><img src="../../assets/imgs/voltar.png" alt="voltar"></a>
    <div>
      <h1>Clientes</h1>
      <p>Cadastre novos clientes ou busque um cadastro existente para atualizar.</p>
    </div>
  </header>

  <main class="workspace">
    <aside class="search-panel">
      <h2>Editar cadastro</h2>
      <p>Digite o nome para buscar um cliente ja cadastrado.</p>
      <input type="text" id="search" placeholder="Buscar cliente cadastrado" autocomplete="off">
      <div id="results" class="suggestions"></div>
      <div id="editingStatus" class="status-card">
        <strong>Novo cliente</strong>
        <span>Nenhum cadastro selecionado.</span>
      </div>
    </aside>

    <section class="form-panel">
      <form method="post" class="clientes">
        <div class="form-grid">
          <label>
            Nome *
            <input type="text" name="nome" id="nome" placeholder="Nome completo" required>
          </label>

          <label>
            Telefone *
            <input type="text" name="telefone" id="telefone" placeholder="(00) 00000-0000" required maxlength="15">
          </label>

          <label>
            Data de Nascimento
            <input type="date" name="dataNascimento" id="dataNascimento">
          </label>

          <label>
            CPF
            <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" maxlength="14">
          </label>

          <label>
            RG
            <input type="text" name="rg" id="rg" placeholder="RG" maxlength="12">
          </label>

          <label>
            E-mail
            <input type="email" name="email" id="email" placeholder="cliente@email.com">
          </label>

          <label class="full">
            Endereco
            <input type="text" name="endereco" id="endereco" placeholder="Rua, numero, bairro">
          </label>

          <label>
            Divida Atual
            <input type="text" name="divida" id="divida" placeholder="0,00">
          </label>

          <label>
            Data de Pagamento
            <input type="date" name="dataPagamento" id="dataPagamento">
          </label>
        </div>

        <div class="actions">
          <button type="submit" id="createButton">Cadastrar Cliente</button>
          <button type="button" id="updateButton">Atualizar Dados</button>
          <button type="button" id="clearButton" class="secondary">Limpar</button>
        </div>
      </form>
    </section>

    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close-button">x</span>
        <p id="modal-text"></p>
      </div>
    </div>
  </main>

  <script src="cliente.js"></script>
</body>
</html>
