<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Historico</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="historico_style.css">
</head>
<body>
  <header class="page-header">
    <a href="../../index.html"><img src="../../assets/imgs/voltar.png" alt="home"></a>
    <div>
      <h1>Historico</h1>
      <p>Consulte vendas e pagamentos por periodo, sem carregar anos de dados de uma vez.</p>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div class="tabs">
        <button id="tabVendas" type="button" class="active">Vendas</button>
        <button id="tabPagamentos" type="button">Pagamentos</button>
      </div>

      <div class="filters">
        <label>
          Inicio
          <input type="date" id="dataInicio">
        </label>
        <label>
          Fim
          <input type="date" id="dataFim">
        </label>
        <label>
          Cliente
          <input type="text" id="clienteFiltro" placeholder="Nome opcional">
        </label>
        <label>
          Limite
          <select id="limiteFiltro">
            <option value="100">100</option>
            <option value="200" selected>200</option>
            <option value="500">500</option>
            <option value="1000">1000</option>
          </select>
        </label>
        <button id="buscarHistorico" type="button">Buscar</button>
        <button id="exportarHistorico" type="button">Exportar CSV</button>
      </div>
    </section>

    <section class="summary-bar">
      <strong id="summaryTitle">Vendas recentes</strong>
      <span id="summaryCount">0 registros</span>
    </section>

    <section class="table-panel">
      <table id="tabela-historico">
        <thead></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="historico.js"></script>
</body>
</html>
